spring.application.name=pfe-spring
# Connexion DB
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/pfe_db
spring.datasource.username=root
spring.datasource.password=
server.port=8081
# Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# spring security currently desactive
# spring.security.user.name=amine
# spring.security.user.password=1234
# spring.security.user.roles=ADMIN
servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
pv.root =pv
pv.template=classpath:/templates/pv_template.docx
spring.web.error.whitelabel.enabled=true
